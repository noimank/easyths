[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["test*"]

[tool.setuptools.package-data]
easyths = ["assets/**/*"]

[project.scripts]
easyths = "easyths.main:main"

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[project]
name = "easyths"
version = "2.0.4"
description = "同花顺交易自动化系统"
authors = [
    { name = "noimank", email = "noimank@163.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
keywords = ["trading", "automation", "tonghuashun", "quantitative"]

dependencies = [
    # 客户端最小依赖（跨平台）
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "numpy<2.4.0",
    "tzdata>=2025.3",
]

[project.optional-dependencies]
# 服务端 - Windows 完整功能
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "wsproto>=1.2",
    # MCP 协议支持
    "fastmcp>=0.4.0",
    # Windows GUI自动化
    "pywinauto>=0.6.8",
    "pywin32>=308",
    # 日志和监控
    "structlog>=24.4.0",
    "colorama>=0.4.6",
    # 配置文件
    "PyYAML>=6.0.2",
    # 工具库
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "pillow>=12.0.0",
    "pandas>=2.3.3",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.2",
    "pyperclip>=1.11.0",
    "mss>=10.1.0",
    "onnx>=1.18.0",
    "onnxruntime>=1.22.0",
    "psutil>=7.1.3",
]

# 开发依赖
dev = [
    "easyths[server]",
    "ruff>=0.16.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pre-commit>=4.0.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-minify-plugin>=0.8.0",
    # mypy 类型存根
    "types-psutil",
    "types-PyYAML",
    "types-tabulate",
    "types-python-dateutil",
    "types-pyperclip",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/noimank/easyths"
Repository = "https://github.com/noimank/easyths.git"
Issues = "https://github.com/noimank/easyths/issues"

# Ruff 代码检查与格式化配置（ruff check + ruff format 取代 black/isort/flake8）
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "captcha_model", # 独立的验证码模型训练子项目，不随包发布
    "site",          # MkDocs 构建产物
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PYI", # flake8-pyi
]
ignore = [
    "E501", # 行长交给 formatter 处理
    "B008", # 允许参数默认值中调用函数（FastAPI Depends 惯用法）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # __init__.py 允许重导出
"main.py" = ["E402"]     # 根启动脚本需先注入 sys.path 再导入

[tool.ruff.lint.isort]
known-first-party = ["easyths"]

# MyPy 类型检查配置
[tool.mypy]
python_version = "3.12"
files = ["easyths"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# 控件查找（get_control_with_children 等）返回 Optional，业务代码依赖
# BaseOperation 统一异常处理兜底，链式调用不做逐处 None 检查
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = [
    "pywinauto.*",
    "win32gui.*",
    "win32api.*",
    "win32con.*",
    "mss.*",
    "onnxruntime.*",
    "fastmcp.*",
]
ignore_missing_imports = true

# Pytest 配置
# 单元测试默认运行（testpaths）；集成测试位于 test/integration，会触发真实交易，
# 仅在显式指定路径运行时执行（含 IDE 直接运行单个测试，无需附加 marker 参数）
[tool.pytest.ini_options]
testpaths = ["test/unit"]
addopts = "--strict-markers"
markers = [
    "integration: 需要运行中的同花顺客户端或本地服务的集成测试（test/integration）",
]
